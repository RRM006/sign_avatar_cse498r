  </defs>
  <rect width="960" height="420" fill="#fff"/>
  <text x="16" y="24" class="h" font-size="15">Figure 5. Execution plan phases and dependencies (PLANNED; ◆ = owner approval gate)</text>

  <rect class="p" x="16" y="50" width="120" height="50" rx="5"/><text x="26" y="70" class="h">A ◆ Decisions</text><text x="26" y="88" class="s">G1, G6, G10, …</text>
  <rect class="p" x="166" y="50" width="120" height="50" rx="5"/><text x="176" y="70" class="h">B Lab PC setup</text><text x="176" y="88" class="s">env, disk, backup</text>
  <rect class="p" x="316" y="50" width="120" height="50" rx="5"/><text x="326" y="70" class="h">C ◆ Manifest</text><text x="326" y="88" class="s">audit, near-copies</text>
  <rect class="p" x="466" y="50" width="120" height="50" rx="5"/><text x="476" y="70" class="h">D ◆ Split S1 v1</text><text x="476" y="88" class="s">freeze + test lock</text>
  <rect class="p" x="616" y="50" width="120" height="50" rx="5"/><text x="626" y="70" class="h">E ◆ Extraction</text><text x="626" y="88" class="s">3,456 unique clips</text>
  <rect class="p" x="766" y="50" width="120" height="50" rx="5"/><text x="776" y="70" class="h">F ◆ QC</text><text x="776" y="88" class="s">thresholds (G9)</text>
  <path class="l" d="M136,75 H164"/><path class="l" d="M286,75 H314"/><path class="l" d="M436,75 H464"/><path class="l" d="M586,75 H614"/><path class="l" d="M736,75 H764"/>

  <rect class="hum" x="316" y="150" width="270" height="50" rx="5"/><text x="326" y="170" class="h">G ◆ Real gloss annotation (people)</text><text x="326" y="188" class="s">review batches, 20% double review, expert spot checks</text>
  <path class="l" d="M526,100 C526,125 451,125 451,148"/>

  <rect class="p" x="616" y="150" width="130" height="50" rx="5"/><text x="626" y="170" class="h">H ◆ Kaggle</text><text x="626" y="188" class="s">private features set</text>
  <rect class="p" x="766" y="150" width="120" height="50" rx="5"/><text x="776" y="170" class="h">I Colab</text><text x="776" y="188" class="s">fallback only</text>
  <path class="l" d="M826,100 C826,125 681,125 681,148"/><path class="l" d="M746,175 H764"/>

  <rect class="p" x="466" y="240" width="140" height="50" rx="5"/><text x="476" y="260" class="h">J Baselines</text><text x="476" y="278" class="s">G0, B0, B1, metric tests</text>
  <path class="l" d="M826,200 C826,225 536,215 536,238"/>
  <rect class="p" x="166" y="240" width="140" height="50" rx="5"/><text x="176" y="260" class="h">K Model A</text><text x="176" y="278" class="s">needs ≥ 300 reviewed</text>
  <rect class="p" x="676" y="240" width="140" height="50" rx="5"/><text x="686" y="260" class="h">L Model B</text><text x="686" y="278" class="s">full data, 3 seeds</text>
  <path class="l" d="M451,200 C451,225 236,215 236,238"/><path class="l" d="M466,265 H308"/><path class="l" d="M606,265 H674"/><path class="l" d="M681,200 C700,220 740,225 746,238"/>

  <rect class="p" x="316" y="330" width="140" height="50" rx="5"/><text x="326" y="350" class="h">M Ablations</text><text x="326" y="368" class="s">val only, seeds</text>
  <rect class="p" x="516" y="330" width="130" height="50" rx="5"/><text x="526" y="350" class="h">N Avatar</text><text x="526" y="368" class="s">end-to-end</text>
  <rect class="g" x="696" y="330" width="120" height="50" rx="5"/><text x="706" y="350" class="h">O ◆ Final eval</text><text x="706" y="368" class="s">test set used once</text>
  <rect class="g" x="836" y="330" width="110" height="50" rx="5"/><text x="846" y="350" class="h">P ◆ Release</text><text x="846" y="368" class="s">push only on OK</text>
  <path class="l" d="M236,290 C236,315 386,305 386,328"/><path class="l" d="M746,290 C746,310 400,300 392,328"/><path class="l" d="M746,290 C746,310 600,305 581,328"/>
  <path class="l" d="M456,355 C560,395 640,395 696,365"/><path class="l" d="M646,355 H694"/><path class="l" d="M816,355 H834"/>
  <text x="16" y="406" class="s">Model B (L) can start before the annotation work (G) finishes because it uses G0 pseudo-glosses; Model A (K) cannot.</text>
