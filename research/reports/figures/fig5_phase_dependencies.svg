<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .h{font-weight:600;font-size:12.5px}.s{fill:#333;font-size:10.5px}
      .p{fill:#eef2f7;stroke:#2c5f9e;stroke-width:1.3}
      .hum{fill:#fdf0d8;stroke:#b7791f;stroke-width:1.3}
      .g{fill:#fdecea;stroke:#b03a2e;stroke-width:1.3}
      .l{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
