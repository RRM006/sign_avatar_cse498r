<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .h{font-weight:600;font-size:13px}.s{fill:#333;font-size:11px}
      .loc{fill:#e3f1e6;stroke:#2f7d43;stroke-width:1.4}
      .kag{fill:#e6eef8;stroke:#2c5f9e;stroke-width:1.4}
      .col{fill:#f3e8f7;stroke:#7a4a8c;stroke-width:1.4;stroke-dasharray:5 3}
      .no{fill:#fdecea;stroke:#b03a2e;stroke-width:1.4}
      .l{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ld{stroke:#7a4a8c;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 3}
    </style>
  </defs>
  <rect width="960" height="430" fill="#fff"/>
  <text x="16" y="24" class="h" font-size="15">Figure 3. Proposed hybrid workflow: what runs where, and what moves (PLANNED)</text>

  <rect class="loc" x="16" y="44" width="420" height="300" rx="8"/>
  <text x="30" y="66" class="h">LOCAL LAB PC (Windows, CPU) — keeps all raw videos</text>
  <text x="30" y="90" class="s">• videos (66.3 GiB), FinalSheet2.xlsx, manifest, splits</text>
  <text x="30" y="108" class="s">• MediaPipe extraction (CPU, overnight) → features/&lt;feat_ver&gt;/</text>
  <text x="30" y="126" class="s">• QC report, near-copy scan, split freeze</text>
  <text x="30" y="144" class="s">• gloss drafts + human review sheets</text>
  <text x="30" y="162" class="s">• small CPU training runs, tests, demo, avatar viewer</text>
  <text x="30" y="180" class="s">• backups (second drive / external disk)</text>
  <rect x="30" y="200" width="390" height="60" rx="5" fill="#fff" stroke="#2f7d43"/>
  <text x="42" y="222" class="h">Export package (approved files only)</text>
  <text x="42" y="240" class="s">features .npz + manifest/split CSVs + UPLOAD_MANIFEST.csv</text>
  <text x="42" y="254" class="s">(SHA-256 per file; automatic pre-upload check)</text>
  <rect class="no" x="30" y="276" width="390" height="54" rx="5"/>
  <text x="42" y="298" class="h">Never leaves this PC</text>
  <text x="42" y="316" class="s">raw videos · frames/images · raw face mesh · reviewer names · tokens</text>

  <rect class="kag" x="540" y="44" width="404" height="190" rx="8"/>
  <text x="554" y="66" class="h">KAGGLE (primary training, if the account checks pass)</text>
  <text x="554" y="92" class="s">Private dataset: bdsl-features-&lt;feat_ver&gt; (team only)</text>
  <text x="554" y="112" class="s">Notebook: git clone pinned commit → uv/pip pinned deps</text>
  <text x="554" y="132" class="s">GPU if available → train → ckpt_last.pt / ckpt_best.pt</text>
  <text x="554" y="152" class="s">Save Version keeps /kaggle/working outputs</text>
  <text x="554" y="172" class="s">Resume: add previous version output as input</text>
  <text x="554" y="192" class="s">Limits (GPU hours, session length): read from the account</text>
  <text x="554" y="212" class="s">— never assumed (G3)</text>

  <rect class="col" x="540" y="260" width="404" height="120" rx="8"/>
  <text x="554" y="282" class="h">COLAB (fallback only)</text>
  <text x="554" y="304" class="s">features zip on Google Drive → copy to /content</text>
  <text x="554" y="324" class="s">checkpoints written to Drive every N epochs</text>
  <text x="554" y="344" class="s">runtime resets lose /content: never keep the only copy there</text>
  <text x="554" y="364" class="s">same code, same pinned commit, env layer "colab"</text>

  <path class="l" d="M420,230 C480,230 480,110 538,110"/>
  <text x="446" y="152" class="s">upload</text><text x="446" y="166" class="s">(~0.6 GB est.)</text>
  <path class="l" d="M538,200 C490,200 480,320 438,320"/>
  <text x="452" y="262" class="s">download</text><text x="452" y="276" class="s">checkpoints,</text><text x="452" y="290" class="s">metrics, logs</text>
  <path class="ld" d="M420,250 C470,300 490,330 538,330"/>

  <text x="16" y="406" class="s">Solid: primary route. Dashed: fallback. Every transfer is verified by SHA-256 on both sides. Any new upload channel needs the owner's OK (ADR-0017).</text>
</svg>
