# Base configuration. Layers, later ones win:
#   base.yaml <- env/<local|kaggle|colab>.yaml <- data/<pilot50|full>.yaml <- env vars
# Env vars: BDSL_ENV picks the env layer; BDSL_DATA_ROOT / BDSL_WORK_DIR replace the two roots.
# Paths may use ${project_root} or ${dotted.key}. No machine-specific absolute paths here.

project:
  name: bdsl
  seed: 42

paths:
  data_root: ${project_root}/dataset/initial_dataset   # source data, read-only
  work_dir: ${project_root}/work                       # every generated output (gitignored)
  models_dir: ${paths.work_dir}/models                 # downloaded pretrained models
  reports_dir: ${paths.work_dir}/reports
  manifests_dir: ${paths.work_dir}/manifests
  splits_dir: ${paths.work_dir}/splits
  pilot_work_dir: ${paths.work_dir}/pilot              # pilot selection before copying
  pilot_dest_dir: ${project_root}/dataset/pilot50_v1   # pilot copies + their manifest (ADR-0017)
  features_dir: ${paths.work_dir}/features             # <feat_ver>/<Index>.npz + qc.csv
  annotations_dir: ${project_root}/annotations         # tracked in git: a commit publishes it (ADR-0017)
  runs_dir: ${paths.work_dir}/runs                     # training runs: logs, metrics, checkpoints
  demo_dir: ${paths.work_dir}/demo                     # Day 5 demo outputs
  vrm_file: ${paths.models_dir}/vrm/Base_Female.vrm    # CC0 VRoid sample avatar (VRM 0.x), gitignored

data:
  sheet: FinalSheet2.xlsx
  sheet_name: Sheet1
  sample_dir: ${paths.data_root}/videos   # sample50: the 50 committed clips

mediapipe:
  version: "0.10.35"
  model_file: holistic_landmarker.task
  model_url: https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/latest/holistic_landmarker.task
  # Downloaded 2026-10-22; identical to the earlier project's copies. The URL says "latest", so the
  # env check fails if a future download differs.
  model_sha256: e2dab61191e2dcd0a15f943d8e3ed1dce13c82dfa597b9dd39f562975a50c3f8

text:
  norm_ver: norm_v1   # NFC + `। . ? ! ,` → space + collapsed whitespace; spelling never changed

manifest:
  version: v1
  workers: 6          # processes for hashing + header probing

split:                # ADR-0018
  name: S1
  version: v0         # v1 after the full shared-segment scan (open_questions G2)
  salt: S1-v0
  ratios: {train: 80, val: 10, test: 10}
  # Clips that share recorded segments, joined into one leakage group (colour cluster, ADR-0018).
  known_shared_segment_links: [[3456, 3457, 3458]]

pilot:                # design doc 04 §F-6
  name: pilot50_v1
  seed: 20261022
  counts: {train: 40, val: 5, test: 5}
  core: {families: 6, train_per_family: 4}   # each family also gives 1 held-out clip (val/test alternate)
  diversity_heldout: [[val, question], [val, negation], [test, question], [test, negation]]
  # Held-out clips are chosen after the 40 train clips, preferring sentences whose words all occur in
  # pilot train (owner, 2026-10-22); otherwise the unseen words are listed per clip.
  heldout_prefer_in_vocab: true
  # A core held-out sibling with unseen words is swapped for a same-split sentence made only of
  # pilot-train words, when one exists (owner chose option B, 2026-10-22).
  heldout_fallback_pool: true
  diversity_train: {question: 2, negation: 2, number_time: 3, long: 3, short: 2, other: 4}
  quotas: {landscape_min: 7, low_res_min: 3, all_duration_quartiles: true}
  low_res_short_side: 500
  long_min_tokens: 7
  short_max_tokens: 2

features:            # Day 2 Step 1; design doc 04 §F-8/§F-9, ADR-0019 (no raw face mesh stored)
  layout: feat_layout_v1
  fps: 15             # resampling grid (nearest source timestamp)
  workers: 5          # one process per clip
  # HolisticLandmarker thresholds — the documented defaults.
  landmarker:
    min_face_detection_confidence: 0.5
    min_face_suppression_threshold: 0.3
    min_face_landmarks_confidence: 0.5
    min_pose_detection_confidence: 0.5
    min_pose_suppression_threshold: 0.3
    min_pose_landmarks_confidence: 0.5
    min_hand_landmarks_confidence: 0.5

annotations:         # Day 2 Step 2; ADR-0015, annotations/GLOSS_CONVENTION_v0.1.md
  g0_ver: G0-v0.1
  pilot_file: pilot50_v1_gloss_v01.csv
  reviewers_file: REVIEWERS.csv   # owner-maintained reviewer codes (no names)

text2gloss:          # Day 3 Step 1, Model A; design doc 04 §F-10 (A-GRU), ADR-0020 (metrics)
  model:
    emb: 128
    enc_hidden: 256   # per direction (BiGRU)
    dec_hidden: 256
    attn: 256         # Bahdanau attention size
    dropout: 0.2
  train:
    lr: 0.001         # Adam
    batch_size: 8
    max_epochs: 300
    patience: 30      # early stopping on val gloss WER (greedy decoding)
    clip: 1.0
    label_smoothing: 0.1
  beam: 4             # final evaluation
  max_len: 20         # decoding limit in target tokens
  seeds: [42, 43, 44]
  tag_prefix: true    # reviewed tags become target tokens before the gloss, e.g. "<q-wh> তোমার বাবা কি করা"

gloss2motion:        # Day 4, Model B; design doc 04 §F-10 (NAR), §F-9 (gaps), ADR-0019 (representation)
  feat_ver: fa89892d4908   # pilot features, VIDEO mode (ADR-0023)
  max_gap: 5          # hand gaps up to 5 frames (0.33 s) are interpolated and flagged; longer stay masked
  model: {d: 192, heads: 4, enc_layers: 3, dec_layers: 3, ff: 512, dropout: 0.1}
  loss: {hand_weight: 2.0, lambda_vel: 0.5, lambda_len: 0.1}   # owner OK 2026-10-22
  train:
    lr: 0.0005        # AdamW
    weight_decay: 0.01
    batch_size: 8
    max_epochs: 600
    patience: 60      # early stopping on val masked position L1 (true lengths)
    clip: 1.0
    overfit_epochs: 400
  max_frames: 300     # cap on the predicted length (longest pilot clip: 272 frames)
  seeds: [42, 43, 44]

avatar:              # Day 5; design doc 04 §F-12, ADR-0019; owner choices 2026-10-22 (G11: Model B + B1)
  demo_model_run: gloss2motion_gloss_pilot50_20261022T133822Z
  demo_seed: 42
  smooth: {min_cutoff: 1.0, beta: 0.3, d_cutoff: 1.0}   # One-Euro filter on body + hands
  viewer: {three: "0.186.1", three_vrm: "3.5.5", cdn: cdn.jsdelivr.net, vrm: Base_Female.vrm}

env_check:
  report_file: env_report.json
  expected_python: "3.12"
  # Rotation test clips in data.sample_dir: 0.mp4 carries a 270° flag, 2.mp4 none (test_log 2026-10-22).
  rotation_clips: ["0.mp4", "2.mp4"]
  benchmark:
    matmul_size: 512
    matmul_repeats: 20
    mediapipe_frames: 5
