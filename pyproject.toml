[project]
name = "bdsl"
version = "0.1.0"
description = "Bangla text to BdSL 3D-avatar research pipeline (CSE498R)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Local data processing (desktop CPU, ADR-0016): manifest, splits, MediaPipe feature extraction.
# numpy/OpenCV pins match the combination that imported with mediapipe 0.10.35 on 2026-10-21, and
# pandas/openpyxl the versions that read FinalSheet2.xlsx then (agent_docs/test_log.md).
extract = [
    "mediapipe==0.10.35",
    "opencv-contrib-python==5.0.0.93",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
]
# Model training. Kaggle and Colab keep their preinstalled torch; this extra is for the desktop.
train = [
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv]
# Windows desktop + Linux (Kaggle/Colab) only.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache folder in the repo.
addopts = "-p no:cacheprovider"
